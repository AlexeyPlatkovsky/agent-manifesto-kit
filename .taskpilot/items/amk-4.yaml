description: 'Canonical feature record migrated from the former docs/features/F001_capability-discovery-and-adoption tree.


  Summary: The kit lets consumer maintainers discover reusable capabilities and bundles, then copy a selected unit into the correct provider-specific layout with predictable conflict behavior and complete bundle contents.


  Requirements:

  - F001-R1: Catalog discovers flat capabilities and bundle items with type and bundle ownership.

  - F001-R2: Adoption copies capabilities into provider type directories and bundle extras under the bundle root.

  - F001-R3: Adoption protects existing targets with replace/skip handling and explicit --force replacement.

  - F001-R4: Invalid names, providers, or sources return a non-zero actionable error.


  Acceptance criteria:

  - agentkit list shows flat capabilities and bundles, including SDD.

  - Adopting SDD for Claude copies typed capabilities and .claude/sdd/templates.

  - Conflicts prompt unless --force is supplied.

  - Unknown names fail non-zero with an actionable message.


  Tasks:

  - F001-T1 scan capability and bundle directories.

  - F001-T2 resolve provider destinations and copy items/extras.

  - F001-T3 implement conflict handling and --force.

  - F001-T4 validate inputs and report errors.

  - F001-T5 adopt SDD into this repository''s .claude workshop target.


  Scenarios:

  - F001-S1 discover the SDD bundle and typed items.

  - F001-S2 adopt the complete SDD bundle for Claude.

  - F001-S3 preserve an existing target without --force.

  - F001-S4 reject an unknown capability.


  Out of scope: changing the reusable product bundle; AI-assisted adaptation (tracked by F002). Status: done.'
