description: 'Goal: fold the lessons of the first building built with concept-asset-builder (a two-storey shop) into the skill, version 1.8.3. Scope: wear_stats dark mode with a percentile wall reference and per-view exclusions, overlay_masks.py, extra renders in reviews, camera fit on both axes (Blender and Three.js), measure_silhouette in object coordinates per view, hard owner constraints in the spec, a sheet check for stamped patterns, a large/composite object section, measurement caveats; tests, CHANGELOG, package version. Non-goals: scene assembly; new engines.'
dor:
- concept-asset-builder 1.8.2 is released (tag v1.8.2); the shop run (exp4_shop, reviewer 6.99 -> 7.92) exposed the gaps listed in the description; items 1-5 already exist in the user's installed copy.
