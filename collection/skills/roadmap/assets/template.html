<!doctype html>
<html lang="/*LANG*/">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>/*TITLE*/</title>
<meta name="roadmap-template" content="/*TEMPLATE*/">
<!-- Generated by roadmap.py from TaskPilot items and git history; edit the template, not the output. -->
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --ink: #1f2328; --muted: #6b7280; --line: #e3e3df; --line2: #d0d0ca;
  --done: #2f9e5b; --progress: #2f6fdb; --ready: #12a1a1; --backlog: #9aa0a6; --cancelled: #b9bcc0;
  --rework: #e8820c; --stalled: #8fa9d9; --link: #7c8591; --reworklink: #9b4fd1; --today: #d6336c; --mile: #8a6d3b;
  --summary: #3b4250; --rowalt: #f0f0ec; --hover: #fff6d6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171a; --panel: #1d2024; --ink: #e6e8eb; --muted: #9aa1aa; --line: #2b2f35; --line2: #3a3f46;
    --done: #3fb872; --progress: #4f8af0; --ready: #22b8b8; --backlog: #6f767e; --cancelled: #50555c;
    --rework: #f0962e; --stalled: #4d6694; --link: #8a939e; --reworklink: #b87ae6; --today: #f0568c; --mile: #c9a86a;
    --summary: #c4cad3; --rowalt: #1a1d21; --hover: #3a3420;
  }
}
:root[data-theme="dark"] {
  --bg: #15171a; --panel: #1d2024; --ink: #e6e8eb; --muted: #9aa1aa; --line: #2b2f35; --line2: #3a3f46;
  --done: #3fb872; --progress: #4f8af0; --ready: #22b8b8; --backlog: #6f767e; --cancelled: #50555c;
  --rework: #f0962e; --stalled: #4d6694; --link: #8a939e; --reworklink: #b87ae6; --today: #f0568c; --mile: #c9a86a;
  --summary: #c4cad3; --rowalt: #1a1d21; --hover: #3a3420;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 13px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; }
header { padding: 10px 16px 8px; border-bottom: 1px solid var(--line); background: var(--panel); display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
header h1 { font-size: 16px; margin: 0; font-weight: 650; }
header .meta { color: var(--muted); font-size: 12px; }
.controls { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.controls button, .controls input[type=search] { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line2); border-radius: 6px; padding: 3px 9px; }
.controls button { cursor: pointer; }
.controls button:hover { border-color: var(--muted); }
.controls label { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; user-select: none; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); align-items: center; }
.legend svg { vertical-align: -3px; }
.summarybar { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; }
.summarybar b { font-weight: 650; }
#scroller { flex: 1; overflow: auto; position: relative; }
#grid { position: relative; width: max-content; min-width: 100%; }
#axissvg, #chart, #labels, #axis .corner { flex: none; }
#axis { position: sticky; top: 0; z-index: 3; display: flex; background: var(--panel); border-bottom: 1px solid var(--line2); }
#axis .corner { position: sticky; left: 0; z-index: 4; background: var(--panel); border-right: 1px solid var(--line2); padding: 6px 10px; color: var(--muted); font-size: 12px; display: flex; align-items: flex-end; }
#body { display: flex; position: relative; }
#labels { position: sticky; left: 0; z-index: 2; background: var(--panel); border-right: 1px solid var(--line2); }
.row { height: var(--rowh); display: flex; align-items: center; gap: 6px; padding-right: 8px; white-space: nowrap; overflow: hidden; cursor: pointer; border-bottom: 1px solid transparent; }
.row.alt { background: var(--rowalt); }
.row.hl, .row:hover { background: var(--hover); }
.row .caret { width: 14px; flex: none; text-align: center; color: var(--muted); font-size: 10px; }
.row .rid { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); flex: none; }
.row .title { overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.row.d0 .title { font-weight: 650; }
.row.d1 .title { font-weight: 550; }
.row .chip { flex: none; font-size: 10.5px; padding: 0 6px; border-radius: 9px; color: #fff; line-height: 16px; }
.row .cnt { flex: none; font-size: 11px; color: var(--muted); }
.row .rw { flex: none; color: var(--rework); font-weight: 700; }
.row.closed .title { color: var(--muted); }
#chart { display: block; }
#tip { position: fixed; z-index: 10; max-width: 420px; background: var(--panel); border: 1px solid var(--line2); border-radius: 8px; padding: 8px 10px; box-shadow: 0 6px 24px rgba(0,0,0,.18); pointer-events: none; display: none; font-size: 12px; }
#tip b { font-weight: 650; }
#tip .k { color: var(--muted); }
#detail { position: fixed; right: 12px; bottom: 12px; z-index: 9; width: min(480px, calc(100vw - 24px)); max-height: 55vh; overflow: auto; background: var(--panel); border: 1px solid var(--line2); border-radius: 10px; padding: 12px 14px; box-shadow: 0 8px 30px rgba(0,0,0,.22); display: none; }
#detail h2 { font-size: 14px; margin: 0 24px 6px 0; }
#detail .close { position: absolute; right: 10px; top: 8px; cursor: pointer; border: 0; background: none; font-size: 18px; color: var(--muted); }
#detail p { margin: 6px 0; white-space: pre-wrap; }
#detail ul { margin: 4px 0; padding-left: 18px; }
#detail .k { color: var(--muted); }
#detail a { color: var(--progress); cursor: pointer; }
#phases { padding: 8px 16px 10px; background: var(--panel); border-bottom: 1px solid var(--line2); display: grid; grid-template-columns: minmax(150px, 210px) 1fr; gap: 6px 14px; align-items: center; }
#phases .ph-h { grid-column: 1 / -1; display: flex; gap: 10px; align-items: baseline; font-size: 12px; color: var(--muted); }
#phases .ph-h b { color: var(--ink); font-size: 13px; }
#phases .ph-name { font-weight: 650; cursor: pointer; display: flex; gap: 6px; align-items: flex-start; }
#phases .ph-name input { margin: 3px 0 0; }
#phases .ph-h label { cursor: pointer; display: inline-flex; gap: 4px; align-items: center; color: var(--ink); }
#phases .ph-name small { display: block; font-weight: 400; color: var(--muted); font-size: 11.5px; }
.sausage { display: flex; gap: 3px; height: 34px; min-width: 0; }
.seg { position: relative; flex: 1 1 0; min-width: 6px; border-radius: 7px; overflow: hidden; background: var(--rowalt); border: 1px solid var(--line2); cursor: pointer; }
.seg.est { border-style: dashed; }
.seg:hover, .seg.on { border-color: var(--ink); }
.seg .fill { position: absolute; inset: 0 auto 0 0; background: var(--done); opacity: .85; }
.seg .lab { position: absolute; inset: 0; padding: 2px 6px; font-size: 11px; line-height: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
.seg .lab i { font-style: normal; color: var(--muted); display: block; }
.focus { display: none; align-items: center; gap: 4px; background: var(--hover); border: 1px solid var(--line2); border-radius: 12px; padding: 1px 4px 1px 9px; font-size: 12px; }
.focus button { border: 0 !important; background: none !important; padding: 0 4px !important; }
@media (max-width: 700px) { header { padding: 8px 16px; } #phases { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1 id="h1"></h1>
  <span class="meta" id="meta"></span>
  <div class="summarybar" id="totals"></div>
  <div class="controls">
    <button id="zout">−</button><button id="zin">+</button>
    <button id="today"></button>
    <label><input type="checkbox" id="foldDone" checked> <span id="foldLabel"></span></label>
    <label id="sinceBox" style="display:none"><input type="checkbox" id="isoOnly"> <span id="sinceLabel"></span></label>
    <label><input type="checkbox" id="showRel"> <span id="relLabel"></span></label>
    <input type="search" id="q" size="16">
    <span class="focus" id="focus"><span id="focusLabel"></span><button id="focusX">×</button></span>
  </div>
  <div class="legend" id="legend"></div>
</header>
<section id="phases"></section>
<div id="scroller"><div id="grid">
  <div id="axis"><div class="corner" id="corner"></div><svg id="axissvg"></svg></div>
  <div id="body"><div id="labels"></div><svg id="chart"></svg></div>
</div></div>
<div id="tip"></div>
<div id="detail"><button class="close" id="dclose">×</button><div id="dbody"></div></div>
<script type="application/json" id="roadmap-data">/*DATA*/null</script>
<script>
const DATA = JSON.parse(document.getElementById("roadmap-data").textContent);
const H = 3600e3, DAY = 24 * H, ROWH = 24, LABELW = 440;
const I18N = {
  ru: {
    locale: "ru-RU", roadmap: "роадмап", zoomOut: "Мельче", zoomIn: "Крупнее", today: "К сегодня",
    foldDone: "свернуть завершённое", since: l => `только с «${l}»`, showRel: "связи relates",
    search: id => `${id}, название…`, clearFilter: "Снять фильтр", corner: "Эпик / фича / задача",
    status: { done: "готово", in_progress: "в работе", ready: "готово к старту", backlog: "бэклог", cancelled: "отменено" },
    type: { epic: "эпик", feature: "фича", task: "задача", bug: "баг", group: "группа" },
    kind: { work: "работа", rework: "переделка", ongoing: "в работе", stalled: "в работе, без движения", cancelled: "отменено", estimate: "оценка (нет плана)", plan: "план" },
    meta: t => `данные на ${t} (последнее событие по задачам) · roadmap.py`, withRework: "с переделкой",
    lgDone: "готово", lgProgress: "в работе", lgStalled: "в работе, без движения 3+ дня", lgRework: "переделка / доработка",
    lgEstimate: "оценка (бэклог, без плана)", lgPlan: "план (файл плана)", lgBlocks: "блокирует", lgReworkOf: "переделка чего",
    lgCommit: p => `коммит с ${p}`,
    plan: "План", planHint: "крупными мазками: ширина блока = число задач (пунктир: ещё не нарезано на задачи, размер оценён), заливка = сделано; клик — задачи блока в ганте; галочки — какие релизы показывать",
    outside: "вне плана", outsideTip: "Задачи, не входящие ни в один блок плана: история до плана, старые эпики",
    ofTasks: (d, t) => `${d} из ${t} задач`, remaining: "осталось", doneNoItems: "(сделано, без задач в TaskPilot)",
    estNoItems: "(оценка, задачи ещё не заведены)", items: "элементы TaskPilot", block: "блок: ",
    hasRework: "есть переделка", week: n => `нед. ${n}`, dataAsOf: "данные на", span: "охват", inside: "внутри",
    reworkLbl: "переделка", blocksLbl: "блокирует", parent: "родитель", related: "связано",
    created: (c, u) => `создано ${c}, обновлено ${u}`, bars: "полосы", gitStatuses: "статусы в git", commits: "коммиты",
    byCommits: "(по коммитам после закрытия)",
  },
  en: {
    locale: "en-GB", roadmap: "roadmap", zoomOut: "Zoom out", zoomIn: "Zoom in", today: "To today",
    foldDone: "fold finished", since: l => `only since "${l}"`, showRel: "relates links",
    search: id => `${id}, title…`, clearFilter: "Clear filter", corner: "Epic / feature / task",
    status: { done: "done", in_progress: "in progress", ready: "ready", backlog: "backlog", cancelled: "cancelled" },
    type: { epic: "epic", feature: "feature", task: "task", bug: "bug", group: "group" },
    kind: { work: "work", rework: "rework", ongoing: "in progress", stalled: "in progress, no movement", cancelled: "cancelled", estimate: "estimate (no plan)", plan: "plan" },
    meta: t => `data as of ${t} (latest item event) · roadmap.py`, withRework: "with rework",
    lgDone: "done", lgProgress: "in progress", lgStalled: "in progress, no movement for 3+ days", lgRework: "rework / follow-up",
    lgEstimate: "estimate (backlog, no plan)", lgPlan: "plan (plan file)", lgBlocks: "blocks", lgReworkOf: "rework of",
    lgCommit: p => `commit naming ${p}`,
    plan: "Plan", planHint: "big strokes: block width = number of tasks (dashed: not yet split into tasks, size estimated), fill = done; click: the block's tasks in the chart; ticks: which releases to show",
    outside: "outside the plan", outsideTip: "Tasks in no plan block: history before the plan, old epics",
    ofTasks: (d, t) => `${d} of ${t} tasks`, remaining: "remaining", doneNoItems: "(done, no items in TaskPilot)",
    estNoItems: "(estimate, items not created yet)", items: "TaskPilot items", block: "block: ",
    hasRework: "has rework", week: n => `wk ${n}`, dataAsOf: "data as of", span: "span", inside: "inside",
    reworkLbl: "rework", blocksLbl: "blocks", parent: "parent", related: "related",
    created: (c, u) => `created ${c}, updated ${u}`, bars: "bars", gitStatuses: "statuses in git", commits: "commits",
    byCommits: "(from commits after closing)",
  },
};
const L = I18N[DATA.lang] || I18N.en;
const STATUS = L.status, TYPE = L.type, KIND = L.kind;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const statusVar = s => ({ done: "--done", in_progress: "--progress", ready: "--ready", backlog: "--backlog", cancelled: "--cancelled" })[s] || "--summary";
const T = s => s ? Date.parse(s) : null;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const fmt = t => new Date(t).toLocaleString(L.locale, { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
const store = { get(k, d) { try { const v = localStorage.getItem("roadmap." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
                set(k, v) { try { localStorage.setItem("roadmap." + k, JSON.stringify(v)); } catch (e) {} } };

const rows = DATA.rows, byId = Object.fromEntries(rows.map(r => [r.id, r]));
const NOW = T(DATA.now), SINCE_M = DATA.milestones.find(m => m.since), FORK = SINCE_M ? T(SINCE_M.date) : NOW - 2 * DAY;
rows.forEach(r => { r.bars.forEach(b => { b.S = T(b.s); b.E = Math.max(T(b.e), T(b.s)); b.I = T(b.idle_from); });
  if (r.summary) { r.summary.S = T(r.summary.s); r.summary.E = T(r.summary.e); r.summary.A = T(r.summary.actual_e); }
  r.span = r.summary ? [r.summary.S, r.summary.E] : [Math.min(...r.bars.map(b => b.S)), Math.max(...r.bars.map(b => b.E))];
  r.leafClosed = !r.children.length ? ["done", "cancelled"].includes(r.status) : null; });
const allClosed = r => r.children.length ? r.children.every(c => allClosed(byId[c])) : r.leafClosed;
rows.forEach(r => r.closedAll = allClosed(r));

let pxh = store.get("pxh2", 1.25), focus = null, phaseOn = store.get("phaseOn", {}), collapsed = new Set(store.get("collapsed", [])), opened = new Set(store.get("opened", []));
const el = id => document.getElementById(id);
document.documentElement.lang = DATA.lang;
document.title = `${DATA.title}: ${L.roadmap}`;
el("h1").textContent = document.title;
el("meta").textContent = L.meta(fmt(NOW));
el("zout").title = L.zoomOut; el("zin").title = L.zoomIn; el("today").textContent = L.today;
el("foldLabel").textContent = L.foldDone; el("relLabel").textContent = L.showRel;
el("q").placeholder = L.search((rows.find(r => r.type !== "group") || { id: "ID-1" }).id);
el("focusX").title = L.clearFilter; el("corner").textContent = L.corner;
if (SINCE_M) { el("sinceBox").style.display = ""; el("sinceLabel").textContent = L.since(SINCE_M.label); }

// Totals over leaves.
(() => { const c = {}; rows.filter(r => !r.children.length).forEach(r => c[r.status] = (c[r.status] || 0) + 1);
  const rw = rows.filter(r => r.bars.some(b => b.kind === "rework")).length;
  el("totals").innerHTML = ["done", "in_progress", "ready", "backlog", "cancelled"].filter(s => c[s]).map(s =>
    `<span><b style="color:var(${statusVar(s)})">${c[s]}</b> ${STATUS[s]}</span>`).join("") + (rw ? `<span><b style="color:var(--rework)">${rw}</b> ${L.withRework}</span>` : ""); })();

function legend() {
  const sw = (fill, extra = "") => `<svg width="22" height="12"><rect x="1" y="2" width="20" height="9" rx="2" ${fill} ${extra}/></svg>`;
  el("legend").innerHTML = [
    [sw(`fill="var(--done)"`), L.lgDone], [sw(`fill="var(--progress)"`), L.lgProgress],
    [sw(`fill="var(--stalled)"`), L.lgStalled], [sw(`fill="url(#rwp)"`), L.lgRework],
[sw(`fill="none" stroke="var(--backlog)" stroke-dasharray="3 2"`), L.lgEstimate],
    [sw(`fill="none" stroke="var(--progress)" stroke-width="2" stroke-dasharray="5 2"`), L.lgPlan],
    [`<svg width="22" height="12"><path d="M1 6H17" stroke="var(--link)" fill="none"/><path d="M15 3l4 3-4 3" fill="var(--link)"/></svg>`, L.lgBlocks],
    [`<svg width="22" height="12"><path d="M1 6H17" stroke="var(--reworklink)" stroke-dasharray="3 2" fill="none"/><path d="M15 3l4 3-4 3" fill="var(--reworklink)"/></svg>`, L.lgReworkOf],
    [`<svg width="10" height="12"><circle cx="5" cy="7" r="2.5" fill="var(--muted)"/></svg>`, L.lgCommit((DATA.id_prefixes.join("/") || "ID") + "-id")],
  ].map(([i, t]) => `<span>${i} ${t}</span>`).join("");
}

function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())), day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);
  return Math.ceil(((t - Date.UTC(t.getUTCFullYear(), 0, 1)) / DAY + 1) / 7);
}

// Plan: one "sausage" per phase, a segment per block sized by its tasks and filled by the done share.
function phases() {
  const P = DATA.phases || [];
  if (!P.length) { el("phases").style.display = "none"; return; }
  const pct = (d, t) => t ? Math.round(100 * d / t) : 0;
  el("phases").innerHTML = `<div class="ph-h"><b>${L.plan}</b><span>${L.planHint}</span>
    <label title="${esc(L.outsideTip)}"><input type="checkbox" data-ph=""${phaseOn[""] === false ? "" : " checked"}> ${L.outside}</label></div>` +
    P.map((ph, pi) => `<label class="ph-name" title="${esc(ph.goal)}"><input type="checkbox" data-ph="${esc(ph.id)}"${phaseOn[ph.id] === false ? "" : " checked"}><span>${esc(ph.title)}<small>${pct(ph.done, ph.total)}% · ${L.ofTasks(ph.done, ph.total)}</small></span></label>
      <div class="sausage">${ph.blocks.map((b, bi) => `<div class="seg ${b.items.length ? "" : "est"}" data-p="${pi}" data-b="${bi}" style="flex-grow:${b.total}"
        title="${esc(`${b.title}: ${L.ofTasks(b.done, b.total)}${b.note ? "\n" + b.note : ""}${b.open.length ? "\n" + L.remaining + ": " + b.open.join(", ") : ""}`)}">
        <div class="fill" style="width:${pct(b.done, b.total)}%"></div><div class="lab">${esc(b.title)}<i>${b.done}/${b.total}</i></div></div>`).join("")}</div>`).join("");
  // Release filter: an unchecked phase hides its epics, features and tasks (a row's phase: roadmap.py phase_of).
  el("phases").addEventListener("change", e => { const c = e.target.closest("input[data-ph]"); if (!c) return;
    phaseOn[c.dataset.ph] = c.checked; store.set("phaseOn", phaseOn); render(); });
  el("phases").addEventListener("click", e => {
    const sg = e.target.closest(".seg"); if (!sg) return;
    const b = P[+sg.dataset.p].blocks[+sg.dataset.b];
    document.querySelectorAll(".seg.on").forEach(x => x.classList.remove("on"));
    // Every click replaces the filter; a block without items has nothing to show in the chart.
    if (b.items.length) { sg.classList.add("on"); setFocus({ ids: new Set(b.items), label: b.title }); } else setFocus(null);
    const chip = id => byId[id] ? `<li><a data-go="${id}">${id}</a> ${esc(byId[id].title)} <span class="k">· ${STATUS[byId[id].status] || byId[id].status}</span></li>` : "";
    el("dbody").innerHTML = `<h2>${esc(P[+sg.dataset.p].title)} · ${esc(b.title)}</h2><div class="k">${L.ofTasks(b.done, b.total)}${b.items.length ? "" : b.total && b.done === b.total ? " " + L.doneNoItems : " " + L.estNoItems}</div>
      ${b.note ? `<p>${esc(b.note)}</p>` : ""}${b.items.length ? `<div class="k">${L.items}</div><ul>${b.items.map(chip).join("")}</ul>` : ""}
      ${b.open.length ? `<div class="k">${L.remaining}</div><ul>${b.open.map(chip).join("")}</ul>` : ""}`;
    el("detail").style.display = "block";
  });
}
function setFocus(f) {
  focus = f;
  el("focus").style.display = f ? "inline-flex" : "none";
  el("focusLabel").textContent = f ? L.block + f.label : "";
  if (!f) document.querySelectorAll(".seg.on").forEach(x => x.classList.remove("on"));
  render(); toToday();
}

function visibleRows() {
  const out = [], q = el("q").value.trim().toLowerCase(), iso = !!SINCE_M && el("isoOnly").checked, fold = el("foldDone").checked;
  const inFocus = r => { for (let p = r; p; p = byId[p.parent]) if (focus.ids.has(p.id)) return true; return false; };
  const phaseOk = r => phaseOn[r.phase || ""] !== false;
  const match = r => (!q || r.id.toLowerCase().includes(q) || r.title.toLowerCase().includes(q)) && (!focus || inFocus(r)) && phaseOk(r) || (r.children || []).some(c => match(byId[c]));
  // A search or a block filter opens auto-folded groups; a group the user folded stays folded.
  const isClosed = r => r.children.length && (collapsed.has(r.id) || (fold && !q && !focus && r.closedAll && !opened.has(r.id)));
  const walk = (r) => {
    if (!match(r)) return;
    if (iso && r.span[1] < FORK && r.closedAll) return;
    out.push(r);
    if (!isClosed(r)) r.children.forEach(c => walk(byId[c]));
  };
  rows.filter(r => !r.parent).forEach(walk);
  return { list: out, isClosed, match };
}

function render() {
  const { list, isClosed, match } = visibleRows();
  const iso = !!SINCE_M && el("isoOnly").checked;
  let t0 = Math.min(...list.map(r => r.span[0]).filter(isFinite)), t1 = Math.max(NOW, ...list.map(r => r.span[1]).filter(isFinite));
  if (!isFinite(t0)) t0 = NOW - DAY;  // nothing visible (a search with no match)
  if (iso) t0 = Math.max(t0, FORK - 6 * H);
  t0 = new Date(t0).setHours(0, 0, 0, 0); t1 = new Date(t1 + DAY).setHours(0, 0, 0, 0);
  const weekMode = DAY / H * pxh < 60;
  if (weekMode) { const d = new Date(t0); d.setDate(d.getDate() - (d.getDay() + 6) % 7); t0 = d.getTime();
    const e = new Date(t1); e.setDate(e.getDate() + (8 - e.getDay()) % 7); t1 = e.getTime(); }
  const W = Math.ceil((t1 - t0) / H * pxh), X = t => Math.round((Math.max(t, t0) - t0) / H * pxh * 10) / 10;
  const HGT = list.length * ROWH;
  document.documentElement.style.setProperty("--rowh", ROWH + "px");

  // Labels.
  el("corner").style.width = el("labels").style.width = LABELW + "px";
  el("labels").innerHTML = list.map((r, i) => {
    const caret = r.children.length ? (isClosed(r) ? "▶" : "▼") : "";
    const cnt = r.counts && Object.keys(r.counts).length ? `<span class="cnt">${r.counts.done || 0}/${Object.values(r.counts).reduce((a, b) => a + b, 0)}</span>` : "";
    const rw = r.bars.some(b => b.kind === "rework") || r.rework_of.length ? `<span class="rw" title="${esc(L.hasRework)}">↻</span>` : "";
    const chip = r.status ? `<span class="chip" style="background:var(${statusVar(r.status)})">${STATUS[r.status] || r.status}</span>` : "";
    return `<div class="row d${r.depth} ${i % 2 ? "alt" : ""} ${r.closedAll ? "closed" : ""}" data-id="${r.id}" style="padding-left:${6 + r.depth * 16}px">
      <span class="caret">${caret}</span>${r.type !== "group" ? `<span class="rid">${r.id}</span>` : ""}<span class="title" title="${esc(r.title)}">${esc(r.title)}</span>${rw}${cnt}${chip}</div>`;
  }).join("");

  // Axis.
  const ax = el("axissvg"), AH = 58;  // lanes: week or day labels 15, milestones 29, "data as of" 42, day numbers or hours 53
  ax.setAttribute("width", W); ax.setAttribute("height", AH);
  let a = "";
  const weekW = 7 * DAY / H * pxh, every = Math.ceil(60 / weekW);
  // The label fits the week's width: full range, the week number, or a date on every n-th week.
  const weekLabel = (dd, end, f) => { const n = isoWeek(dd);
    const txt = weekW >= 160 ? `${L.week(n)} · ${f(dd)} – ${f(end)}` : weekW >= 60 ? L.week(n) : n % every ? "" : f(dd);
    return txt ? `<text x="${X(dd.getTime()) + 5}" y="15" font-size="11.5" fill="var(--ink)" font-weight="600">${txt}</text>` : ""; };
  const dayW = DAY / H * pxh, step = pxh >= 16 ? 3 : pxh >= 8 ? 6 : pxh >= 4 ? 12 : 0;
  for (let d = t0; d < t1; d = new Date(d + DAY + 2 * H).setHours(0, 0, 0, 0)) {
    const x = X(d), dd = new Date(d), we = [0, 6].includes(dd.getDay());
    if (weekMode) {  // week labels on Mondays, day numbers below when there is room
      if (dd.getDay() === 1) { const end = new Date(d + 6 * DAY + 2 * H), f = o => o.toLocaleDateString(L.locale, { day: "numeric", month: "short" }).replace(".", "");
        a += `<line x1="${x}" y1="0" x2="${x}" y2="${AH}" stroke="var(--line2)"/>${weekLabel(dd, end, f)}`; }
      else a += `<line x1="${x}" y1="${AH - 4}" x2="${x}" y2="${AH}" stroke="var(--line2)"/>`;
      if (dayW >= 16) a += `<text x="${x + 2}" y="${AH - 5}" font-size="9.5" fill="var(${we ? "--muted" : "--ink"})" opacity=".7">${dd.getDate()}</text>`;
      continue;
    }
    a += `<line x1="${x}" y1="0" x2="${x}" y2="${AH}" stroke="var(--line2)"/>`;
    const lab = dd.toLocaleDateString(L.locale, dayW > 70 ? { weekday: "short", day: "2-digit", month: "2-digit" } : { day: "2-digit", month: "2-digit" });
    a += `<text x="${x + 4}" y="15" font-size="11.5" fill="var(${we ? "--muted" : "--ink"})" font-weight="600">${lab}</text>`;
    if (step) for (let h = step; h < 24; h += step) { const xh = X(d + h * H);
      a += `<line x1="${xh}" y1="${AH - 4}" x2="${xh}" y2="${AH}" stroke="var(--line2)"/><text x="${xh + 2}" y="${AH - 5}" font-size="10" fill="var(--muted)">${h}</text>`; }
  }
  let freeX = -1e9;  // milestone labels only where they do not run into the previous one; all keep a tooltip
  DATA.milestones.forEach(m => { const x = X(T(m.date)); if (T(m.date) < t0) return;
    a += `<path d="M${x} 20 l4 5 -4 5 -4 -5z" fill="var(--mile)"><title>${esc(m.label)}</title></path>`;
    if (x > freeX) { a += `<text x="${x + 6}" y="30" font-size="10.5" fill="var(--mile)">${esc(m.label)}</text>`; freeX = x + 12 + m.label.length * 6; } });
  a += `<line x1="${X(NOW)}" y1="0" x2="${X(NOW)}" y2="${AH}" stroke="var(--today)" stroke-width="2"/><text x="${X(NOW) + 4}" y="42" font-size="10.5" fill="var(--today)" font-weight="600">${esc(L.dataAsOf)}</text>`;
  ax.innerHTML = a;

  // Chart.
  const ch = el("chart"); ch.setAttribute("width", W); ch.setAttribute("height", HGT);
  const yc = i => i * ROWH + ROWH / 2, pos = {};
  list.forEach((r, i) => pos[r.id] = i);
  let s = `<defs>
    <pattern id="rwp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--rework)"/><rect width="2.5" height="6" fill="rgba(255,255,255,.35)"/></pattern>
    <pattern id="cxp" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="5" height="5" fill="var(--cancelled)"/><rect width="1.5" height="5" fill="rgba(0,0,0,.18)"/></pattern>
    <marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="var(--link)"/></marker>
    <marker id="ahr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="var(--reworklink)"/></marker>
  </defs>`;
  list.forEach((r, i) => { if (i % 2) s += `<rect x="0" y="${i * ROWH}" width="${W}" height="${ROWH}" fill="var(--rowalt)"/>`; });
  for (let d = t0; d < t1; d = new Date(d + DAY + 2 * H).setHours(0, 0, 0, 0)) {
    const mon = new Date(d).getDay() === 1;
    if (!weekMode || mon || dayW >= 12) s += `<line x1="${X(d)}" y1="0" x2="${X(d)}" y2="${HGT}" stroke="var(${weekMode && mon ? "--line2" : "--line"})" ${weekMode && !mon ? `opacity=".5"` : ""}/>`;
  }
  DATA.milestones.forEach(m => { if (T(m.date) >= t0) s += `<line x1="${X(T(m.date))}" y1="0" x2="${X(T(m.date))}" y2="${HGT}" stroke="var(--mile)" stroke-dasharray="4 4" opacity=".7"/>`; });

  const MINW = 5;
  const barRect = (r, b, i) => {
    const x = X(b.S), w = Math.max(MINW, X(b.E) - x), y = yc(i) - 7, h = 14, c = `var(${statusVar(r.status)})`;
    const tag = `data-id="${r.id}" data-k="${b.kind}" data-s="${b.S}" data-e="${b.E}"`;
    if (b.kind === "estimate") return `<rect ${tag} x="${x}" y="${y + 1}" width="${w}" height="${h - 2}" rx="3" fill="${c}" fill-opacity=".08" stroke="${c}" stroke-dasharray="4 3"/>`;
    if (b.kind === "plan") return `<rect ${tag} x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="${c}" fill-opacity=".12" stroke="${c}" stroke-width="2" stroke-dasharray="6 3"/>`;
    if (b.kind === "rework") return `<rect ${tag} x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="url(#rwp)"/>`;
    if (b.kind === "cancelled") return `<rect ${tag} x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="url(#cxp)"/>`;
    if (b.kind === "stalled") { const xi = Math.max(x + MINW, X(b.I));
      return `<rect ${tag} x="${x}" y="${y}" width="${xi - x}" height="${h}" rx="3" fill="var(--stalled)"/><line ${tag} x1="${xi}" y1="${yc(i)}" x2="${X(b.E)}" y2="${yc(i)}" stroke="var(--stalled)" stroke-width="2" stroke-dasharray="1 4" stroke-linecap="round"/>`; }
    if (b.kind === "ongoing") return `<rect ${tag} x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="var(--progress)"/><path d="M${x + w} ${y} l6 7 -6 7z" fill="var(--progress)"/>`;
    return `<rect ${tag} x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="${c}"/>`;
  };
  list.forEach((r, i) => {
    if (r.summary) {
      const x0 = X(r.summary.S), x1 = Math.max(x0 + MINW, X(r.summary.E)), xa = r.summary.A ? Math.max(x0, X(r.summary.A)) : x0, y = yc(i) - (isClosed(r) ? 5 : 9);
      s += `<g data-id="${r.id}" data-k="summary" data-s="${r.summary.S}" data-e="${r.summary.E}">`;
      if (x1 > xa) s += `<rect x="${xa}" y="${y}" width="${x1 - xa}" height="5" fill="var(--summary)" opacity=".28"/>`;
      if (xa > x0) s += `<rect x="${x0}" y="${y}" width="${xa - x0}" height="5" fill="var(--summary)"/>`;
      s += `<path d="M${x0} ${y}v9l4 -4z M${x1} ${y}v9l-4 -4z" fill="var(--summary)"/><rect x="${x0}" y="${y - 3}" width="${x1 - x0}" height="12" fill="transparent"/></g>`;
      if (isClosed(r)) { // folded: also draw children's leaf bars faintly in this row
        const leaves = []; const coll = c => { const k = byId[c]; k.children.length ? k.children.forEach(coll) : match(k) && leaves.push(k); }; r.children.forEach(coll);  // leaves the filters keep
        leaves.forEach(k => k.bars.forEach(b => { if (b.kind !== "estimate") s += `<rect x="${X(b.S)}" y="${yc(i) + 2}" width="${Math.max(2, X(b.E) - X(b.S))}" height="5" fill="${b.kind === "rework" ? "var(--rework)" : `var(${statusVar(k.status)})`}" opacity=".75"/>`; }));
      }
    }
    // Parents show the summary bracket; of their own bars only rework and cancellation add information.
    r.bars.forEach(b => { if (!r.children.length || ["rework", "cancelled"].includes(b.kind)) s += barRect(r, b, i); });
    r.ticks.forEach(([t, h, subj]) => { if (T(t) >= t0) s += `<circle cx="${X(T(t))}" cy="${yc(i) + 9.5}" r="1.8" fill="var(--muted)"><title>${esc(h + " " + subj)}</title></circle>`; });
  });

  // Dependency arrows (blocks), rework links, optional relates.
  const anchor = id => { let r = byId[id]; while (r && pos[r.id] == null) r = byId[r.parent]; return r; };
  const firstS = r => r.summary ? r.summary.S : Math.min(...r.bars.map(b => b.S));
  const lastE = r => r.summary ? r.summary.E : Math.max(...r.bars.map(b => b.E));
  const actualE = r => { const a = r.bars.filter(b => !["estimate", "plan"].includes(b.kind)); return a.length ? Math.max(...a.map(b => b.E)) : lastE(r); };
  const seen = new Set();
  const sel = render.sel;
  const arrow = (from, to, cls) => {
    const A = anchor(from), B = anchor(to); if (!A || !B || A === B) return "";
    // Finished history keeps its arrows for the selected row only; anything unfinished always shows them.
    if (byId[from].closedAll && byId[to].closedAll && ![from, to, A.id, B.id].includes(sel)) return "";
    const key = A.id + ">" + B.id + cls; if (seen.has(key)) return ""; seen.add(key);
    const ia = pos[A.id], ib = pos[B.id];
    const xa = X(cls === "rw" ? actualE(A) : lastE(A)), ya = yc(ia), xb = X(firstS(B)), yb = yc(ib);
    const col = cls === "rw" ? "var(--reworklink)" : "var(--link)", mk = cls === "rw" ? "ahr" : "ah";
    const dash = cls === "rel" ? `stroke-dasharray="2 3"` : cls === "rw" ? `stroke-dasharray="5 3"` : "";
    let d;
    if (xb - xa > 14) { const mx = xa + 8; d = `M${xa} ${ya}H${mx}V${yb}H${xb - 1}`; }
    else { const my = yb + (yb > ya ? -ROWH / 2 : ROWH / 2); d = `M${xa} ${ya}h8V${my}H${xb - 10}V${yb}H${xb - 1}`; }
    return `<path class="arr" data-a="${A.id}" data-b="${B.id}" d="${d}" fill="none" stroke="${col}" stroke-width="1.2" ${dash} marker-end="${cls === "rel" ? "" : `url(#${mk})`}" opacity=".75"/>`;
  };
  rows.forEach(r => { r.blocks.forEach(t => s += arrow(r.id, t, "blk")); r.rework_of.forEach(o => s += arrow(o, r.id, "rw"));
    if (el("showRel").checked) r.relates.forEach(t => s += arrow(r.id, t, "rel")); });
  s += `<line x1="${X(NOW)}" y1="0" x2="${X(NOW)}" y2="${HGT}" stroke="var(--today)" stroke-width="2" opacity=".85"/>`;
  ch.innerHTML = s;
  render.X = X; render.t0 = t0; render.W = W;
}

// Interaction.
const tip = el("tip");
function describe(r, k, S, E) {
  const kids = r.counts && Object.keys(r.counts).length ? Object.entries(r.counts).map(([s, n]) => `${n} ${STATUS[s] || s}`).join(", ") : "";
  return `<b>${r.type !== "group" ? r.id + " · " : ""}${esc(r.title)}</b><br>
    <span class="k">${TYPE[r.type] || r.type}${r.status ? " · " + (STATUS[r.status] || r.status) : ""}</span>
    ${k ? `<br><span class="k">${k === "summary" ? L.span : KIND[k] || k}:</span> ${fmt(S)} → ${fmt(E)}` : ""}
    ${kids ? `<br><span class="k">${L.inside}:</span> ${kids}` : ""}
    ${r.rework_of.length ? `<br><span class="k">${L.reworkLbl}:</span> ${r.rework_of.join(", ")}` : ""}
    ${r.blocks.length ? `<br><span class="k">${L.blocksLbl}:</span> ${r.blocks.join(", ")}` : ""}`;
}
document.addEventListener("mousemove", e => {
  const t = e.target.closest("[data-k]");
  if (!t) { tip.style.display = "none"; return; }
  const r = byId[t.dataset.id];
  tip.innerHTML = describe(r, t.dataset.k, +t.dataset.s, +t.dataset.e);
  tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(e.clientX + 14, innerWidth - w - 8) + "px";
  tip.style.top = (e.clientY + 16 + h > innerHeight ? e.clientY - h - 10 : e.clientY + 16) + "px";
});
function showDetail(id) {
  const r = byId[id]; if (!r) return;
  const hist = r.history.map(([t, s]) => `<li>${fmt(T(t))}: ${STATUS[s] || s}</li>`).join("");
  const ticks = r.ticks.map(([t, h, subj]) => `<li>${fmt(T(t))} <code>${h}</code> ${esc(subj)}</li>`).join("");
  const bars = r.bars.map(b => `<li>${KIND[b.kind] || b.kind}: ${fmt(b.S)} → ${fmt(b.E)}${b.from === "commits" ? " " + L.byCommits : ""}</li>`).join("");
  const lk = ids => ids.map(i => `<a data-go="${i}">${i}</a>`).join(", ");
  el("dbody").innerHTML = `<h2>${r.type !== "group" ? r.id + " · " : ""}${esc(r.title)}</h2>
    <div class="k">${TYPE[r.type] || r.type}${r.status ? " · " + (STATUS[r.status] || r.status) : ""}${r.priority ? " · " + r.priority : ""}${r.created ? ` · ${L.created(fmt(T(r.created)), fmt(T(r.updated)))}` : ""}</div>
    ${r.parent && byId[r.parent].type !== "group" ? `<div><span class="k">${L.parent}:</span> ${lk([r.parent])}</div>` : ""}
    ${r.blocks.length ? `<div><span class="k">${L.blocksLbl}:</span> ${lk(r.blocks)}</div>` : ""}
    ${r.relates.length ? `<div><span class="k">${L.related}:</span> ${lk(r.relates)}</div>` : ""}
    ${r.rework_of.length ? `<div><span class="k">${L.reworkLbl}:</span> ${lk(r.rework_of)}</div>` : ""}
    ${r.desc ? `<p>${esc(r.desc)}</p>` : ""}
    ${bars ? `<div class="k">${L.bars}</div><ul>${bars}</ul>` : ""}
    ${hist ? `<div class="k">${L.gitStatuses}</div><ul>${hist}</ul>` : ""}
    ${ticks ? `<div class="k">${L.commits}</div><ul>${ticks}</ul>` : ""}`;
  el("detail").style.display = "block";
  if (render.sel !== id) { render.sel = id; const sc = el("scroller"), l = sc.scrollLeft, tp = sc.scrollTop; render(); sc.scrollLeft = l; sc.scrollTop = tp; }
  document.querySelectorAll(".row.hl").forEach(x => x.classList.remove("hl"));
  const row = document.querySelector(`.row[data-id="${id}"]`); if (row) row.classList.add("hl");
}
el("dclose").onclick = () => { el("detail").style.display = "none"; render.sel = null; const sc = el("scroller"), l = sc.scrollLeft; render(); sc.scrollLeft = l; };
el("dbody").addEventListener("click", e => { const a = e.target.closest("[data-go]"); if (!a) return;
  let p = byId[a.dataset.go].parent; while (p) { collapsed.delete(p); opened.add(p); p = byId[p].parent; }
  render(); showDetail(a.dataset.go); const row = document.querySelector(`.row[data-id="${a.dataset.go}"]`); if (row) row.scrollIntoView({ block: "center" }); });
el("labels").addEventListener("click", e => {
  const row = e.target.closest(".row"); if (!row) return; const r = byId[row.dataset.id];
  if (r.children.length && (e.target.classList.contains("caret") || e.target.closest(".caret") || r.type === "group" || r.depth === 0 && e.detail === 2)) {
    const { isClosed } = visibleRows();
    if (isClosed(r)) { collapsed.delete(r.id); opened.add(r.id); } else { collapsed.add(r.id); opened.delete(r.id); }
    store.set("collapsed", [...collapsed]); store.set("opened", [...opened]); render(); return;
  }
  showDetail(r.id);
});
el("chart").addEventListener("click", e => { const t = e.target.closest("[data-id]"); if (t) showDetail(t.dataset.id); });
const keepCenter = f => { const sc = el("scroller"), c = sc.scrollLeft + (sc.clientWidth - LABELW) / 2, t = render.t0 + c / pxh * H; f(); render(); sc.scrollLeft = (t - render.t0) / H * pxh - (sc.clientWidth - LABELW) / 2; };
el("zin").onclick = () => keepCenter(() => { pxh = Math.min(48, pxh * 1.5); store.set("pxh2", pxh); });
el("zout").onclick = () => keepCenter(() => { pxh = Math.max(0.3, pxh / 1.5); store.set("pxh2", pxh); });
const toToday = () => { const sc = el("scroller"); sc.scrollLeft = Math.max(0, render.X(NOW) - (sc.clientWidth - LABELW) * 0.7); };
el("today").onclick = toToday;
["foldDone", "isoOnly", "showRel"].forEach(id => { el(id).checked = store.get(id, el(id).checked); el(id).onchange = () => { store.set(id, el(id).checked); render(); }; });
el("q").oninput = render;
el("focusX").onclick = () => setFocus(null);
legend(); phases(); render(); toToday();
</script>
