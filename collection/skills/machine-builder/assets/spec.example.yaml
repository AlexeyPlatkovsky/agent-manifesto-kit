# Example spec for a walker. Copy to assets/units/<id>/spec.yaml and adapt; other profiles: SKILL.md section 10.
unit: striker_03
profile: walker
class: medium
dimensions_m: {height: 5.2, width: 3.6, depth: 2.8}
mass_t: 45
design_language: docs/art/direction/50-characters.md

skeleton:            # rotations: Euler XYZ in Blender bone-local space; Y runs along the bone (twist)
  root:    {parent: null}
  pelvis:  {parent: root}
  torso:   {parent: pelvis, rom: {y: [-90, 90]}, joint: torso_ring}
  thigh_L: {parent: pelvis, rom: {x: [-60, 45], z: [-15, 15]}, joint: hip_ball}
  shin_L:  {parent: thigh_L, rom: {x: [0, 110]}, joint: knee_hinge}
  foot_L:  {parent: shin_L, rom: {x: [-30, 30], z: [-15, 15]}, joint: ankle_2axis}
  upperarm_L: {parent: torso, rom: {x: [-150, 60], z: [-20, 90]}, joint: shoulder_ball}
  forearm_L: {parent: upperarm_L, rom: {x: [0, 120]}, joint: elbow_hinge}
  # ... mirrored R side (thigh_R, shin_R, foot_R, upperarm_R, forearm_R) and head: every bone a pose names must exist

parts:
  - {id: ct__chest_plate, bone: torso, location: ct, function: armour, kit: plate, params: {w: 1.8, h: 1.2, t: 0.12}}
  - {id: ll__knee_actuator_L, bone: thigh_L, location: ll, function: actuator, drives: shin_L, kit: piston}
  - {id: ll__foot_L, bone: foot_L, location: ll, function: contact, kit: foot_3toe, contact: true}
  - {id: rt__lrm_pod, bone: torso, location: rt, function: weapon, kit: missile_rack, params: {tubes: 10}}

hardpoints:
  - {id: rt_missile, type: missile, size: medium, bone: torso}
  - {id: la_gun, type: ballistic, size: large, bone: forearm_L}

fx_sockets: [muzzle_la_gun, exhaust_back_L, exhaust_back_R, cockpit_cam]

paint_schemes:
  default: {base: "#8a8478", secondary: "#3d3d3a", accent: "#d9a21b", number: "03", insignia: chevron}

budgets: {tris_lod0: 60000, tris_lod1: 15000, tris_lod2: 4000}

test_poses:
  crouch: {thigh_L: [-50, 0, 0], shin_L: [80, 0, 0], foot_L: [-30, 0, 0], thigh_R: [-50, 0, 0], shin_R: [80, 0, 0], foot_R: [-30, 0, 0]}
  stride_L: {thigh_L: [-35, 0, 0], shin_L: [20, 0, 0], thigh_R: [25, 0, 0]}
  arms_up: {upperarm_L: [-120, 0, 0], upperarm_R: [-120, 0, 0]}
sweeps:
  torso_yaw: {bone: torso, axis: y, from: -90, to: 90, step: 15}
  # a sweep may hold other bones first, e.g. arms raised while the torso twists:
  # torso_yaw_arms_up: {bone: torso, axis: y, from: -90, to: 90, step: 15, pose: {upperarm_L: [-120, 0, 0]}}
# pose values may also be {rot: [x, y, z], loc: [x, y, z]} (bone-local metres) for translations such as suspension
allowed_contacts: []     # part pairs that may touch by design
min_support_margin_m: 0.1
