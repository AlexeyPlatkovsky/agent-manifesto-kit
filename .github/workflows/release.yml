name: Release

on:
  push:
    branches: [main]

# Avoid overlapping releases.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # create tags, commits, and GitHub releases
  issues: write # comment on released issues
  pull-requests: write # comment on released PRs
  id-token: write # npm publish provenance (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # semantic-release needs full history + tags
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
          registry-url: "https://registry.npmjs.org/"
          cache: npm
      # Trusted publishing (OIDC) needs npm >= 11.5.1.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
