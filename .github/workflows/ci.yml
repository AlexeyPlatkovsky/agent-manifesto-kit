name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      # Informational: some capabilities (e.g. the kit-adopt skill) legitimately name
      # provider entrypoints like CLAUDE.md, so this reports findings without gating the build.
      - name: Neutrality lint (provider-specific tokens)
        continue-on-error: true
        run: node dist/cli.js lint
